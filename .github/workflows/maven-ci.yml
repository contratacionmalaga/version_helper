name: Java CI with Maven

on:
  push:
    branches:
      - main    # O la rama que uses por defecto
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw -B clean verify

      - name: Run OWASP Dependency Check
        uses: dependency-check/owasp-dependency-check-action@v2
        with:
          project: 'version_helper'
          scanPath: '.'
